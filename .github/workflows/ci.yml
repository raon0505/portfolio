name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # package.json의 packageManager(pnpm@11.5.3)를 그대로 사용
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Lint (Stylelint)
        run: pnpm lint:css

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # webServer 설정이 next build → next start까지 수행한다
      - name: Build + E2E (a11y)
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
